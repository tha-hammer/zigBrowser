<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Automation Input Fixture</title>
  </head>
  <body>
    <!-- Plain contenteditable: the browser's own editing applies the text. -->
    <div id="plain" contenteditable="true" style="min-height: 20px; border: 1px solid #999"></div>

    <!-- Draft.js-like editor (the shape of X's post box): it cancels every
         beforeinput, applies the edit to its own model, and re-renders. -->
    <div id="draft" contenteditable="true" style="min-height: 20px; border: 1px solid #999"></div>

    <!-- dom.press: Enter submits, Tab moves focus, Escape reaches the target. -->
    <form id="form">
      <input id="q" name="q" />
      <input id="q2" name="q2" />
      <!-- cancels every keydown: no default action may run -->
      <input id="nokey" name="nokey" />
      <input id="cb" type="checkbox" />
    </form>

    <!-- dom.selectOption: native select, ARIA combobox, ARIA listbox. -->
    <select id="sel">
      <option value="a">Alpha</option>
      <option value="b">Beta</option>
      <option value="c">Gamma</option>
      <option value="d" disabled>Delta</option>
      <optgroup label="Retired" disabled>
        <option value="e">Epsilon</option>
      </optgroup>
    </select>

    <button id="combo" role="combobox" aria-controls="combo-list" aria-expanded="false">Pick a fruit</button>
    <ul id="combo-list" role="listbox" hidden></ul>

    <ul id="lb" role="listbox">
      <li role="option" data-value="one" aria-selected="true">One</li>
      <li role="option" data-value="two" aria-selected="false">Two</li>
      <li role="option" data-value="three" aria-selected="false" aria-disabled="true">Three</li>
    </ul>

    <!-- Two options share a value: the chosen one must be the one selected. -->
    <select id="dup">
      <option value="same">First</option>
      <option value="same">Second</option>
    </select>

    <!-- An option covered by an overlay cannot receive the click. -->
    <div style="position: relative; display: inline-block">
      <ul id="covered" role="listbox" style="margin: 0">
        <li role="option" data-value="under">Under</li>
      </ul>
      <div id="cover" style="position: absolute; inset: 0; background: rgba(0,0,0,0.1)"></div>
    </div>

    <select id="sel-disabled" disabled>
      <option value="x">X</option>
      <option value="y">Y</option>
    </select>

    <!-- Combobox whose options take longer than one script attempt to render. -->
    <button id="slowcombo" role="combobox" aria-controls="slow-list" aria-expanded="false">Pick slowly</button>
    <ul id="slow-list" role="listbox" hidden></ul>

    <!-- Options appear 700 ms after opening: later than a short RPC timeout. -->
    <button id="ghostcombo" role="combobox" aria-controls="ghost-list" aria-expanded="false">Ghost</button>
    <ul id="ghost-list" role="listbox" hidden></ul>

    <!-- Decoy: an unrelated visible listbox with the same option names. -->
    <ul id="decoy" role="listbox">
      <li role="option" data-value="banana">Banana</li>
      <li role="option" data-value="late">Late</li>
    </ul>

    <!-- Room to scroll any control out of the viewport. -->
    <div id="spacer" style="height: 3000px"></div>

    <!-- Controls below the fold: actions must scroll them into view. -->
    <button id="below" onclick="window.belowClicks = (window.belowClicks || 0) + 1">Below</button>
    <input id="belowinput" />

    <script>
      window.selInputs = 0;
      window.selChanges = 0;
      window.disabledSelChanges = 0;
      document.getElementById('sel-disabled').addEventListener('change', function () {
        window.disabledSelChanges += 1;
      });
      window.coveredClicks = 0;
      document.querySelector('#covered [role=option]').addEventListener('click', function () {
        window.coveredClicks += 1;
      });
      window.decoyClicks = 0;
      document.querySelectorAll('#decoy [role=option]').forEach(function (option) {
        option.addEventListener('click', function () { window.decoyClicks += 1; });
      });

      window.ghostValue = null;
      var ghost = document.getElementById('ghostcombo');
      var ghostList = document.getElementById('ghost-list');
      ghost.addEventListener('click', function () {
        if (ghost.getAttribute('aria-expanded') === 'true') return;
        ghost.setAttribute('aria-expanded', 'true');
        setTimeout(function () {
          var li = document.createElement('li');
          li.setAttribute('role', 'option');
          li.setAttribute('data-value', 'boo');
          li.textContent = 'Boo';
          li.addEventListener('click', function () { window.ghostValue = 'boo'; });
          ghostList.appendChild(li);
          ghostList.hidden = false;
        }, 700);
      });

      window.slowOpenClicks = 0;
      window.slowValue = null;
      var slow = document.getElementById('slowcombo');
      var slowList = document.getElementById('slow-list');
      slow.addEventListener('click', function () {
        window.slowOpenClicks += 1;
        var open = slow.getAttribute('aria-expanded') === 'true';
        slow.setAttribute('aria-expanded', open ? 'false' : 'true');
        if (open) { slowList.hidden = true; slowList.innerHTML = ''; return; }
        setTimeout(function () {
          var li = document.createElement('li');
          li.setAttribute('role', 'option');
          li.setAttribute('data-value', 'late');
          li.textContent = 'Late';
          li.addEventListener('click', function () {
            window.slowValue = 'late';
            slow.setAttribute('aria-expanded', 'false');
            slowList.hidden = true;
          });
          slowList.appendChild(li);
          slowList.hidden = false;
        }, 1500);
      });
      var sel = document.getElementById('sel');
      sel.addEventListener('input', function () { window.selInputs += 1; });
      sel.addEventListener('change', function () { window.selChanges += 1; });

      // Combobox whose options render asynchronously after opening.
      window.comboValue = null;
      window.comboClicks = 0;
      var combo = document.getElementById('combo');
      var comboList = document.getElementById('combo-list');
      combo.addEventListener('click', function () {
        window.comboClicks += 1;
        var open = combo.getAttribute('aria-expanded') === 'true';
        combo.setAttribute('aria-expanded', open ? 'false' : 'true');
        if (open) { comboList.hidden = true; comboList.innerHTML = ''; return; }
        setTimeout(function () {
          ['apple', 'banana', 'cherry'].forEach(function (fruit) {
            var li = document.createElement('li');
            li.setAttribute('role', 'option');
            li.setAttribute('data-value', fruit);
            li.textContent = fruit.charAt(0).toUpperCase() + fruit.slice(1);
            li.addEventListener('click', function () {
              window.comboValue = fruit;
              combo.textContent = li.textContent;
              combo.setAttribute('aria-expanded', 'false');
              comboList.hidden = true;
              comboList.innerHTML = '';
            });
            comboList.appendChild(li);
          });
          comboList.hidden = false;
        }, 80);
      });

      document.querySelectorAll('#lb [role=option]').forEach(function (option) {
        option.addEventListener('click', function () {
          document.querySelectorAll('#lb [role=option]').forEach(function (o) {
            o.setAttribute('aria-selected', o === option ? 'true' : 'false');
          });
        });
      });
    </script>

    <script>
      window.submits = 0;
      document.getElementById('form').addEventListener('submit', function (event) {
        event.preventDefault();
        window.submits += 1;
      });
      document.getElementById('nokey').addEventListener('keydown', function (event) {
        event.preventDefault();
      });
      // Every key event, in order, with the focused element at dispatch time.
      window.keylog = [];
      ['keydown', 'keypress', 'keyup'].forEach(function (type) {
        document.addEventListener(type, function (event) {
          window.keylog.push({
            type: event.type, key: event.key, code: event.code, keyCode: event.keyCode,
            shift: event.shiftKey, ctrl: event.ctrlKey, alt: event.altKey, meta: event.metaKey,
            target: event.target.id || event.target.tagName,
            active: (document.activeElement && document.activeElement.id) || ''
          });
        }, true);
      });

      window.plainInputs = 0;
      document.getElementById('plain').addEventListener('input', function () {
        window.plainInputs += 1;
      });

      window.draftModel = '';
      window.draftBeforeInputs = 0;
      window.draftInputs = 0;
      var draft = document.getElementById('draft');
      draft.addEventListener('input', function () { window.draftInputs += 1; });
      function renderDraft() {
        draft.textContent = window.draftModel;
        var range = document.createRange();
        range.selectNodeContents(draft);
        range.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      draft.addEventListener('beforeinput', function (event) {
        window.draftBeforeInputs += 1;
        event.preventDefault();
        var sel = window.getSelection();
        var replacingAll = sel.rangeCount > 0 && !sel.isCollapsed &&
          sel.toString() === window.draftModel;
        if (event.inputType === 'insertText' || event.inputType === 'insertReplacementText') {
          window.draftModel = (replacingAll ? '' : window.draftModel) + (event.data || '');
        } else if (event.inputType === 'deleteContentBackward') {
          window.draftModel = replacingAll ? '' : window.draftModel.slice(0, -1);
        } else if (event.inputType === 'deleteContent' || event.inputType === 'deleteByCut') {
          if (replacingAll) window.draftModel = '';
        }
        renderDraft();
      });
    </script>
  </body>
</html>
