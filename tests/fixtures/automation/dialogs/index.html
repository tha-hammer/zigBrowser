<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dialogs</title>
<script>
  // Every dialog opens from a timer, so the command that asked for it
  // returns first (the page is blocked while a dialog is open).
  function later(fn) { setTimeout(fn, 0); return 0; }
  function showAlert(message) { return later(() => { alert(message); document.title = 'alerted'; }); }
  function askConfirm(message) { return later(() => { document.title = 'confirm:' + confirm(message); }); }
  function askPrompt(message, value) { return later(() => { document.title = 'prompt:' + prompt(message, value); }); }
  function openPopup() { window.open('popup.html', 'dialog-popup', 'width=400,height=300'); return 0; }
  // An unsaved draft: leaving the page asks "Leave site?".
  window.guard = true;
  addEventListener('beforeunload', (event) => {
    if (!window.guard) return;
    event.preventDefault();
    event.returnValue = 'You have an unsaved draft.';
  });
</script>
</head>
<body>
<h1>Dialogs</h1>
<textarea id="draft">unsaved draft</textarea>
</body>
</html>
