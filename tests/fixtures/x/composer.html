<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>X Composer Fixture</title>
    <!-- Imitates the structure of x.com's composer for src/x.zig flows.
         ?mode=compose (default): compose page, Post = tweetButton
         ?mode=home: timeline composer; two hidden tweetButton decoys (display:none, and
                     visibility:hidden with a non-empty box) and a tweetButtonInline that only
                     appears 600 ms after load
         &hold=url: after a Post click the confirmation toast appears only once a
                    fetch of url settles (the test's server holds the flow there)
         &all=1: also render a toast, an inline Post button and a login link, so
                 every x.zig selector-table entry matches (for x.selfcheck)
         ?mode=loggedout: login link, no composer
         &captcha=1: an Arkose-style challenge frame over the composer (N20)
         &limit=1: Post is refused with X's daily-limit toast; nothing is
                   posted (N20)
         The page records what was posted in window.__xResult. -->
    <style>
      body { font-family: sans-serif; margin: 16px; }
      [data-testid="tweetTextarea_0"] { min-height: 40px; border: 1px solid #999; padding: 4px; }
      button, [role="button"] { margin: 8px 4px; padding: 6px 12px; }
      #schedule-dialog[hidden], .gone { display: none; }
      .invisible { visibility: hidden; }
      [data-testid="toast"] { margin-top: 12px; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var mode = params.get('mode') || 'compose';
        var hold = params.get('hold');
        var all = params.get('all') === '1';
        var captcha = params.get('captcha') === '1';
        var limit = params.get('limit') === '1';
        var app = document.getElementById('app');
        window.__xResult = null;
        window.__xPosts = 0;
        window.__xEvents = [];
        // N14: which input was real. Each entry is type:target:isTrusted
        // (target = data-testid, else id, else tag); __xKeyTimes holds the
        // editor's keydown times (ms) for pacing checks.
        window.__xTrust = [];
        window.__xKeyTimes = [];
        ['keydown', 'beforeinput', 'mousemove', 'click'].forEach(function (type) {
          document.addEventListener(type, function (event) {
            var t = event.target && event.target.closest ? event.target.closest('[data-testid]') : null;
            var name = t ? t.getAttribute('data-testid') : (event.target.id || event.target.tagName || 'document');
            window.__xTrust.push(type + ':' + name + ':' + event.isTrusted);
            if (type === 'keydown' && name === 'tweetTextarea_0') window.__xKeyTimes.push(event.timeStamp);
          }, true);
        });

        if (mode === 'loggedout') {
          app.innerHTML = '<h1>Happening now</h1><a href="/login">Log in</a> <a href="/i/flow/signup">Sign up</a>';
          return;
        }

        app.innerHTML =
          '<div data-testid="tweetTextarea_0" contenteditable="true" role="textbox" aria-label="Post text"></div>' +
          '<div>' +
          '  <div data-testid="scheduleOption" role="button" tabindex="0" aria-label="Schedule post">Schedule</div>' +
          (mode === 'home'
            ? '  <button data-testid="tweetButton" class="gone" disabled>Post</button>' +
              '  <button data-testid="tweetButton" class="invisible" disabled>Post</button>' +
              '  <span id="inline-slot"></span>'
            : '  <button data-testid="tweetButton" disabled>Post</button>') +
          '</div>' +
          '<div id="schedule-dialog" role="dialog" aria-label="Schedule" hidden>' +
          '  <select aria-label="Month"></select><select aria-label="Day"></select><select aria-label="Year"></select>' +
          '  <select aria-label="Hour"></select><select aria-label="Minute"></select><select aria-label="AM/PM"></select>' +
          '  <button data-testid="scheduledConfirmationPrimaryAction">Confirm</button>' +
          '</div>' +
          '<div id="toasts">' + (all ? '<div data-testid="toast" role="alert">Shown for selfcheck</div>' : '') + '</div>' +
          (all ? '<button data-testid="tweetButtonInline" disabled>Post</button><a href="/login">Log in</a>' : '') +
          (captcha ? '<iframe id="arkose-challenge" title="arkose challenge" srcdoc="<p>Verify you are human</p>"></iframe>' : '');

        function fill(select, values) {
          values.forEach(function (v) {
            var o = document.createElement('option');
            o.value = String(v);
            o.textContent = String(v);
            select.appendChild(o);
          });
        }
        function range(a, b) { var r = []; for (var i = a; i <= b; i += 1) r.push(i); return r; }
        var selects = {};
        ['Month', 'Day', 'Year', 'Hour', 'Minute', 'AM/PM'].forEach(function (name) {
          selects[name] = document.querySelector('select[aria-label="' + name + '"]');
        });
        fill(selects.Month, range(1, 12));
        fill(selects.Day, range(1, 31));
        fill(selects.Year, range(2026, 2028));
        fill(selects.Hour, range(1, 12));
        fill(selects.Minute, range(0, 59));
        fill(selects['AM/PM'], ['AM', 'PM']);

        // Draft.js-like editor: cancels every beforeinput and applies the
        // edit to its own model. It starts with a restored, unsent draft.
        var editor = document.querySelector('[data-testid="tweetTextarea_0"]');
        var model = 'STALE DRAFT';
        var buttons = Array.prototype.slice.call(document.querySelectorAll('[data-testid="tweetButton"]'));
        function render() {
          editor.textContent = model;
          var r = document.createRange();
          r.selectNodeContents(editor);
          r.collapse(false);
          var sel = window.getSelection();
          if (document.activeElement === editor) {
            sel.removeAllRanges();
            sel.addRange(r);
          }
          buttons.forEach(function (b) { b.disabled = model.length === 0; });
        }
        editor.addEventListener('input', function () { window.__xEvents.push('input'); });
        editor.addEventListener('beforeinput', function (event) {
          event.preventDefault();
          window.__xEvents.push('beforeinput:' + event.inputType);
          var sel = window.getSelection();
          var replacingAll = sel.rangeCount > 0 && !sel.isCollapsed && sel.toString() === model;
          if (event.inputType === 'insertText' || event.inputType === 'insertReplacementText') {
            model = (replacingAll ? '' : model) + (event.data || '');
          } else if (event.inputType === 'deleteContentBackward') {
            model = replacingAll ? '' : model.slice(0, -1);
          } else if (event.inputType === 'deleteContent' || event.inputType === 'deleteByCut') {
            if (replacingAll) model = '';
          }
          render();
        });
        render();

        var schedule = null;
        document.querySelector('[data-testid="scheduleOption"]').addEventListener('click', function () {
          document.getElementById('schedule-dialog').hidden = false;
        });
        document.querySelector('[data-testid="scheduledConfirmationPrimaryAction"]').addEventListener('click', function () {
          schedule = {
            month: selects.Month.value, day: selects.Day.value, year: selects.Year.value,
            hour: selects.Hour.value, minute: selects.Minute.value, ampm: selects['AM/PM'].value
          };
          document.getElementById('schedule-dialog').hidden = true;
          buttons.forEach(function (b) { b.textContent = 'Schedule'; });
        });
        function wire(button) {
          button.addEventListener('click', function () {
            if (button.disabled) return;
            if (limit) {
              var refused = document.createElement('div');
              refused.setAttribute('data-testid', 'toast');
              refused.setAttribute('role', 'alert');
              refused.textContent = 'You are over the daily limit for sending posts.';
              document.getElementById('toasts').appendChild(refused);
              return;
            }
            window.__xPosts += 1;
            window.__xResult = { text: model, scheduled: schedule, button: button.getAttribute('data-testid') };
            var message = schedule ? 'Your post will be sent' : 'Your post was sent.';
            function showToast() {
              var toast = document.createElement('div');
              toast.setAttribute('data-testid', 'toast');
              toast.setAttribute('role', 'alert');
              toast.textContent = message;
              document.getElementById('toasts').appendChild(toast);
            }
            if (hold) fetch(hold).then(showToast);
            else showToast();
            model = '';
            schedule = null;
            render();
          });
        }
        buttons.forEach(wire);
        if (mode === 'home') {
          setTimeout(function () {
            var inline = document.createElement('button');
            inline.setAttribute('data-testid', 'tweetButtonInline');
            inline.textContent = 'Post';
            document.getElementById('inline-slot').appendChild(inline);
            buttons.push(inline);
            wire(inline);
            render();
          }, 600);
        }
      })();
    </script>
  </body>
</html>
