<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>LinkedIn Fixture</title>
    <!-- Imitates the parts of linkedin.com that src/linkedin.zig drives, served
         for every LinkedIn-shaped path by tests/e2e/social_flows_test.py:
           /in/<name>/                 profile (Connect, Follow, Message)
           /feed/update/<id>/          post (Like, Comment)
           /messaging/thread/<id>/     conversation
           /search/results/<type>/     search results (?keywords=)
           /checkpoint/challenge/<id>/ a security checkpoint (the test server
                                       redirects /in/checkpoint-me/ here; N20)
           /in/limit-reached/          Connect opens the weekly invitation-limit
                                       modal instead of the invite dialog (N20)
           /in/twice/                  the profile's own Follow rendered twice
           /in/more-menu/              no own Connect on the page (live, it can sit
                                       under "More")
           /in/same-name/              the suggestion card, and a "More profiles"
                                       section in <main> outside the owner's area,
                                       are for another person with the profile's own
                                       name, present before the profile's own
                                       actions render
           /in/same-name-missing/      those, and no own actions at all
         (the test server redirects /in/gone/ to /feed/: not a profile)
         Live profile (owner probe v2 of 2026-10-11, names redacted): <main> has one
         section, aria-label "Primary content", holding the owner's visible Connect
         (an <a>), Follow and More, plus a display:none copy of Connect and More; a
         clone of Connect and More sits outside <main> in an aria-hidden
         role=toolbar; the "People you may know" cards sit in <aside
         aria-label="Aside"> inside <main>. Clicks on the clone or the hidden copy
         are recorded in window.__li.otherCopies.
         Live markup (probed 2026-10-11): hashed class names; the nav's "Me" is a
         <button> whose text is "Me" (no aria-label); nav links carry counts in
         their aria-labels. A profile's title is "<Name> | LinkedIn" and it has no
         <h1>; its own actions render late (800 ms here) and the "People you may
         know" cards beside them carry the same kinds of labels for other people
         ("Invite <Name> to connect", "Follow <Name>"). Reaction buttons are
         labelled "Reaction button state: <reaction>" with the count as text.
         Every pointer, key and edit event on any page is recorded, before any
         handler, in window.__input (a dry run must leave it empty).
         Every name here is invented.
         ?loggedout=1 renders a signed-out page (sign-in link, no nav "Me").
         Everything the flows did is recorded in window.__li. -->
    <style>
      body { font-family: sans-serif; margin: 16px; }
      button, a { margin: 6px 4px; padding: 4px 10px; display: inline-block; }
      [contenteditable] { min-height: 32px; border: 1px solid #999; padding: 4px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header id="nav"></header>
    <div><div id="sticky" class="_5e1d70" role="toolbar" aria-hidden="true"></div></div>
    <main id="main"></main>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var path = location.pathname;
        var li = window.__li = { page: '', events: [], sent: [], result: null, wrongPerson: [], otherCopies: [] };
        // Every pointer, key and edit event, captured before any handler: a
        // dry run (options.dry_run) must leave this empty.
        var input = window.__input = [];
        ['pointerdown', 'mousedown', 'mouseup', 'click', 'keydown', 'beforeinput', 'input'].forEach(function (type) {
          document.addEventListener(type, function (e) {
            var t = e.target && e.target.closest ? e.target.closest('[id], [aria-label]') : null;
            input.push(type + ':' + (t ? (t.id || t.getAttribute('aria-label')) : 'document'));
          }, true);
        });
        var nav = document.getElementById('nav');
        var main = document.getElementById('main');
        function record(event) { li.events.push(event); }

        if (params.get('loggedout') === '1') {
          li.page = 'loggedout';
          nav.innerHTML = '<a href="/login">Sign in</a> <a href="/signup">Join now</a>';
          // A "Me" button in page content is not the nav's: still signed out.
          main.innerHTML = '<h1>Welcome to your professional community</h1><button type="button">Me</button>';
          return;
        }
        document.title = 'Feed | LinkedIn';
        nav.innerHTML =
          '<nav class="_8f2c1a"><a class="_c03e9b" href="/feed/" aria-label="Home, 1 new notification">Home</a>' +
          '<a class="_c03e9b" href="/messaging/" aria-label="Messaging, 0 new notifications">Messaging</a>' +
          '<button class="_51d0aa" type="button"><img class="_e4a7f2" alt="Sam Example" src="data:,"> Me </button></nav>';

        // A Draft-like editor: cancels beforeinput and keeps its own text.
        function editor(el) {
          var model = '';
          el.addEventListener('beforeinput', function (e) {
            e.preventDefault();
            var sel = window.getSelection();
            var all = sel.rangeCount > 0 && !sel.isCollapsed && sel.toString() === model;
            if (e.inputType === 'insertText') model = (all ? '' : model) + (e.data || '');
            else if (e.inputType === 'deleteContentBackward') model = all ? '' : model.slice(0, -1);
            else if (e.inputType === 'deleteContent' && all) model = '';
            el.textContent = model;
            var r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
            sel.removeAllRanges(); sel.addRange(r);
          });
          return function () { return model; };
        }

        var m;
        if ((m = path.match(/^\/checkpoint\/challenge\/([^/]+)\/$/))) {
          li.page = 'checkpoint';
          main.innerHTML = '<h1>Let\u2019s do a quick security check</h1><form><button type="button" id="verify">Verify</button></form>';
          document.getElementById('verify').addEventListener('click', function () { record('click:verify'); });
        } else if ((m = path.match(/^\/in\/([^/]+)\/$/))) {
          li.page = 'profile:' + m[1];
          var name = 'Sam Example';
          var sameName = m[1] === 'same-name' || m[1] === 'same-name-missing';
          var other = sameName ? name : 'Riley Sample';
          document.title = '(2) ' + name + ' | LinkedIn';
          main.innerHTML =
            '<div><div><section aria-label="Primary content"><div>' +
            '<div data-testid="lazy-column" data-component-type="LazyColumn"><div>' +
            '<section class="_3a9e01"><div class="_77b2c4">' + name + '</div>' +
            '<div class="text-body-medium break-words">Engineer at Example Co</div>' +
            '<span class="text-body-small inline t-black--light break-words">Springfield</span>' +
            '<div id="actions"></div></section>' +
            '</div></div></div></section></div></div>' +
            '<div id="invite" role="dialog" hidden>' +
            '  <button aria-label="Add a note">Add a note</button>' +
            '  <button aria-label="Send without a note">Send without a note</button>' +
            '  <div id="note-box" hidden><textarea name="message"></textarea>' +
            '  <button aria-label="Send invitation">Send</button></div>' +
            '</div>' +
            '<section id="composer" hidden><div class="msg-form__contenteditable" contenteditable="true"></div>' +
            '<button class="msg-form__send-button">Send</button></section>' +
            // "People you may know", inside <main> as live: same kinds of
            // labels for another person. Clicking any of them is a bug.
            '<div><div><aside class="_9c11f0" aria-label="Aside"><h2>People you may know</h2>' +
            '  <button aria-label="Invite ' + other + ' to connect">Connect</button>' +
            '  <button aria-label="Follow ' + other + '">Follow</button>' +
            '  <a aria-label="Message ' + other + '" href="/messaging/compose/?recipient=other">Message</a>' +
            '</aside></div></div>' +
            // Another person with the owner's name elsewhere in <main>, outside
            // the owner's area and before the owner's own buttons render.
            (sameName ? '<section aria-label="More profiles for you"><span>' + name + '</span>' +
              '  <button aria-label="Invite ' + name + ' to connect">Connect</button>' +
              '  <button aria-label="Follow ' + name + '">Follow</button></section>' : '');
          Array.prototype.forEach.call(main.querySelectorAll('aside [aria-label], section[aria-label="More profiles for you"] [aria-label]'), function (el) {
            el.addEventListener('click', function (e) { e.preventDefault(); li.wrongPerson.push(el.getAttribute('aria-label')); });
          });
          var invite = document.getElementById('invite');
          var limited = m[1] === 'limit-reached';
          var hasConnect = m[1] !== 'more-menu' && m[1] !== 'same-name-missing';
          var connectLink = function (extra) { return '<a ' + extra + ' class="_6b0f3e" data-own-connect aria-label="Invite ' + name + ' to connect" href="/preload/custom-invite/">Connect</a>'; };
          var own = m[1] === 'same-name-missing' ? '  <button aria-label="More actions">More</button>' :
            (hasConnect ? '  ' + connectLink('id="connect"') : '') +
            '  <button id="follow" aria-label="Follow ' + name + '">Follow</button>' +
            (m[1] === 'twice' ? '  <button aria-label="Follow ' + name + '">Follow</button>' : '') +
            '  <a id="message" aria-label="Message ' + name + '" href="/messaging/compose/?recipient=' + m[1] + '">Message</a>' +
            '  <button aria-label="More actions">More</button>' +
            // The display:none copy of Connect and More, as live.
            (hasConnect ? '<div class="_2f8a1c" style="display:none">' + connectLink('id="connect-hidden"') + '<button>More</button></div>' : '');
          function pending(note) {
            invite.hidden = true;
            li.result = { action: 'connect', note: note };
            Array.prototype.forEach.call(document.querySelectorAll('[data-own-connect]'), function (b) {
              b.setAttribute('aria-label', 'Pending, click to withdraw invitation sent to ' + name);
              b.textContent = 'Pending';
            });
          }
          invite.querySelector('[aria-label="Add a note"]').addEventListener('click', function () {
            record('click:add_note'); document.getElementById('note-box').hidden = false;
          });
          var noteInput = invite.querySelector('textarea');
          noteInput.addEventListener('keydown', function () { record('keydown:note'); });
          invite.querySelector('[aria-label="Send invitation"]').addEventListener('click', function () { pending(noteInput.value); });
          invite.querySelector('[aria-label="Send without a note"]').addEventListener('click', function () { record('click:send_without_note'); pending(null); });
          var composer = document.getElementById('composer');
          var text = editor(composer.querySelector('[contenteditable]'));
          composer.querySelector('button').addEventListener('click', function () {
            li.sent.push(text()); li.result = { action: 'message', text: text() };
          });
          // The profile's own actions render late, as live.
          setTimeout(function () {
            document.getElementById('actions').innerHTML = own;
            // The aria-hidden toolbar clone, outside <main>.
            if (hasConnect) document.getElementById('sticky').innerHTML = connectLink('id="connect-clone"') + '<button type="button">More</button>';
            ['connect-clone', 'connect-hidden'].forEach(function (id) {
              var copy = document.getElementById(id);
              if (copy) copy.addEventListener('click', function (e) { e.preventDefault(); li.otherCopies.push(id); });
            });
            var connect = document.getElementById('connect');
            if (connect) connect.addEventListener('click', function (e) {
              e.preventDefault();
              record('click:connect');
              if (limited) {
                document.body.insertAdjacentHTML('beforeend',
                  '<div class="artdeco-modal" role="dialog" aria-modal="true"><h2>You\u2019ve reached the weekly invitation limit</h2>' +
                  '<button id="got-it">Got it</button></div>');
                document.getElementById('got-it').addEventListener('click', function () { record('click:got_it'); });
                return;
              }
              invite.hidden = false;
            });
            document.getElementById('follow').addEventListener('click', function () {
              var b = document.getElementById('follow');
              b.setAttribute('aria-label', 'Following ' + name);
              b.textContent = 'Following';
              li.result = { action: 'follow' };
            });
            document.getElementById('message').addEventListener('click', function (e) {
              e.preventDefault(); record('click:message'); composer.hidden = false;
            });
          }, 800);
        } else if ((m = path.match(/^\/messaging\/thread\/([^/]+)\/$/))) {
          li.page = 'conversation:' + m[1];
          main.innerHTML = '<div class="msg-form__contenteditable" contenteditable="true"></div><button class="msg-form__send-button">Send</button>';
          var convText = editor(main.querySelector('[contenteditable]'));
          main.querySelector('button').addEventListener('click', function () {
            li.sent.push(convText()); li.result = { action: 'message', text: convText() };
          });
        } else if ((m = path.match(/^\/feed\/update\/([^/]+)\/$/))) {
          li.page = 'post:' + m[1];
          main.innerHTML =
            '<article><p>Post body</p>' +
            '<button class="_2b7d10" aria-label="Reaction button state: no reaction"><span>12</span></button>' +
            '<button class="_2b7d11" aria-label="Open reactions menu"></button>' +
            '<button aria-label="Comment">Comment</button>' +
            '<button aria-label="Repost">Repost</button>' +
            '<div class="comments-comment-box__form" hidden><div contenteditable="true"></div>' +
            '<button class="comments-comment-box__submit-button">Post</button></div></article>' +
            // Another post's reaction button further down the feed.
            '<article><button class="_2b7d10" aria-label="Reaction button state: no reaction"><span>3</span></button></article>';
          var likeButton = main.querySelector('[aria-label^="Reaction button state: "]');
          likeButton.addEventListener('click', function () {
            likeButton.setAttribute('aria-label', 'Reaction button state: like');
            likeButton.querySelector('span').textContent = '13';
            li.result = { action: 'like' };
          });
          var form = main.querySelector('.comments-comment-box__form');
          main.querySelector('[aria-label="Comment"]').addEventListener('click', function () { form.hidden = false; });
          var commentText = editor(form.querySelector('[contenteditable]'));
          form.querySelector('button').addEventListener('click', function () { li.result = { action: 'comment', text: commentText() }; });
        } else if ((m = path.match(/^\/search\/results\/([^/]+)\/$/))) {
          li.page = 'search';
          li.result = { action: 'search', type: m[1], keywords: params.get('keywords') };
          var items = '';
          for (var i = 0; i < 3; i += 1) items += '<li class="reusable-search__result-container">Result ' + i + '</li>';
          main.innerHTML = '<ul>' + items + '</ul>';
        } else {
          li.page = 'other';
          main.innerHTML = '<h1>Feed</h1>';
        }
      })();
    </script>
  </body>
</html>
