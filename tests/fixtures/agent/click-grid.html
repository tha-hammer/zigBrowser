<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>click grid</title>
    <style>
      /* One solid colour edge to edge (the E2E samples it next to the icon). */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2060a0; }
      #grid { position: fixed; inset: 0; display: grid;
              grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(12, 1fr); }
      #grid div { background: transparent; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script>
      // Every click on the page is recorded with its viewport position and
      // cell; the E2E reads window.__clicks through the automation socket.
      window.__clicks = [];
      const grid = document.getElementById("grid");
      for (let i = 0; i < 16 * 12; i++) {
        const cell = document.createElement("div");
        cell.dataset.i = String(i);
        grid.appendChild(cell);
      }
      document.addEventListener("click", (e) => {
        const cell = e.target.closest("[data-i]");
        window.__clicks.push([e.clientX, e.clientY, cell ? Number(cell.dataset.i) : -1]);
      }, true);
      window.__ready = true;
    </script>
  </body>
</html>
