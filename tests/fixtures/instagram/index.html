<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Instagram Fixture</title>
    <!-- Imitates the parts of instagram.com that src/instagram.zig drives,
         served for every Instagram-shaped path by
         tests/e2e/social_flows_test.py:
           /<username>/              profile (Follow, Message -> DM composer). As
                                     live (2026-10-11), Follow and Message render
                                     1.5 s after the page loads, and a highlights
                                     carousel has its own "Next" button and avatar
                                     images (story selectors match it; clicking it
                                     is recorded in window.__ig.highlightNext)
                                     After Follow (live, 2026-10-11) the header
                                     button reads "Following" plus a chevron
                                     <svg><title>Down chevron icon</title>, so
                                     its textContent is "FollowingDown chevron
                                     icon", beside div[role=button] "Message" and
                                     "Similar accounts"; nine suggested accounts'
                                     Follow buttons appear below the header
           /private.user/            the same, but Follow turns into "Requested"
           /p/<id>/                  post (Like, comment)
           /stories/<username>/      three story frames; Next on the last one
                                     leaves the viewer for the profile. As live
                                     (probe of 2026-10-11): the page behind the
                                     viewer is in <main> and has a zero-size
                                     <button aria-label="Next">; the viewer sits
                                     outside <main>, its controls are
                                     <svg aria-label="..."> inside a
                                     div[role=button], its frame a <video>, and
                                     story previews and avatars are images in
                                     links. Clicks on the zero-size Next or a
                                     preview are recorded in window.__ig.decoyNext
                                     (kept across the viewer's own navigation).
           /stories/decoy.user/      the same viewer plus a second viewer-shaped
                                     Next outside <main> (a carousel); clicks
                                     recorded in window.__ig.decoyNext
           /stories/nonav.user/      the viewer, but the page has no navigation
                                     (no Home icon, no inbox link), as a story
                                     opened directly may have (unverified)
           /stories/gate.user/       no viewer yet: a "View story" button (a
                                     click that would mark the story seen;
                                     shape UNVERIFIED live), its click recorded
                                     in window.__ig.events
         Every pointer, key and edit event on any page is recorded, before any
         handler, in window.__input (a dry run must leave it empty).
           /stories/next.user/       the same viewer; its last Next goes on to
                                     /stories/riley.sample/ (another person)
           /stories/auto.user/       the same viewer, which moves on to
                                     /stories/riley.sample/ BY ITSELF 1 s after
                                     loading, as Instagram does when a frame ends
           /p/blocked/               Like is refused with Instagram's
                                     "Try Again Later" dialog (N20)
         ?loggedout=1 renders a logged-out page (login form).
         Everything the flows did is recorded in window.__ig. -->
    <style>
      body { font-family: sans-serif; margin: 16px; }
      button, [role="button"] { margin: 6px 4px; padding: 4px 10px; display: inline-block; cursor: pointer; }
      svg { width: 24px; height: 24px; }
      [contenteditable] { min-height: 32px; border: 1px solid #999; padding: 4px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <nav id="nav"></nav>
    <main id="main"></main>
    <div id="overlay"></div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var path = location.pathname;
        var ig = window.__ig = { page: '', events: [], result: null, frames: [] };
        // Every pointer, key and edit event, captured before any handler: a
        // dry run (options.dry_run) must leave this empty.
        var input = window.__input = [];
        ['pointerdown', 'mousedown', 'mouseup', 'click', 'keydown', 'beforeinput', 'input'].forEach(function (type) {
          document.addEventListener(type, function (e) {
            var t = e.target && e.target.closest ? e.target.closest('[id], [aria-label]') : null;
            input.push(type + ':' + (t ? (t.id || t.getAttribute('aria-label')) : 'document'));
          }, true);
        });
        var nav = document.getElementById('nav');
        var main = document.getElementById('main');
        function icon(label) {
          return '<svg aria-label="' + label + '" role="img" viewBox="0 0 24 24"><title>' + label + '</title><rect width="24" height="24"/></svg>';
        }

        if (params.get('loggedout') === '1') {
          ig.page = 'loggedout';
          main.innerHTML = '<form><input name="username"><input name="password" type="password"></form><a href="/accounts/login/">Log in</a>';
          return;
        }
        // A story opened directly may have no navigation (no Home icon, no
        // inbox link): suspected live, 2026-10-11 dry run.
        if (path !== '/stories/nonav.user/') nav.innerHTML = '<a href="/">' + icon('Home') + '</a> <a href="/direct/inbox/">Messages</a>';

        var m;
        if ((m = path.match(/^\/stories\/([A-Za-z0-9._]+)\/$/))) {
          ig.page = 'stories:' + m[1];
          var user = m[1];
          var frame = 1;
          var gif = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
          var control = function (id, label) { return '<div role="button" tabindex="0" id="' + id + '"><div>' + icon(label) + '</div></div>'; };
          // The page behind the viewer: its menu's zero-size "Next".
          main.innerHTML =
            '<div><header><section><div role="menu"><div>' +
            '<button aria-label="Next" class="behind-next" style="width:0;height:0;padding:0;margin:0;border:0;overflow:hidden"></button>' +
            '</div></div></section></header></div>';
          // Viewing needs a click first (a "View story" button that marks the
          // story seen; shape UNVERIFIED live): a dry run stops before it.
          if (user === 'gate.user') {
            document.getElementById('overlay').innerHTML =
              '<div><section class="gate"><img alt="" src="' + gif + '" width="56" height="56">' +
              '<div role="button" tabindex="0" id="view-story"><svg width="12" height="12"><title>Play icon</title></svg>View story</div></section></div>';
            document.getElementById('view-story').addEventListener('click', function () { ig.events.push('click:view_story'); });
            return;
          }
          // The viewer, outside <main>.
          document.getElementById('overlay').innerHTML =
            '<div><section class="viewer">' +
            '<a role="link" class="preview" href="/stories/riley.sample/"><img alt="" src="' + gif + '" width="71" height="126"></a>' +
            '<a role="link" class="preview" href="/' + user + '/"><img alt="" src="' + gif + '" width="32" height="32"></a>' +
            control('story-close', 'Close') + control('story-pause', 'Pause') + control('story-previous', 'Previous') +
            '<video width="180" height="320" muted playsinline></video>' +
            control('story-next', 'Next') + '</section>' +
            (user === 'decoy.user' ? '<section class="carousel">' + control('decoy-next', 'Next') + '</section>' : '') +
            '</div>';
          ig.decoyNext = 0;
          var decoy = function (e) {
            e.preventDefault();
            ig.decoyNext += 1;
            try { sessionStorage.setItem('ig_decoy_next', String(ig.decoyNext)); } catch (err) {}
          };
          Array.prototype.forEach.call(document.querySelectorAll('.behind-next, .preview, #decoy-next'), function (el) { el.addEventListener('click', decoy); });
          ig.frames.push(frame);
          if (user === 'auto.user') setTimeout(function () { location.href = '/stories/riley.sample/'; }, 1000);
          document.getElementById('story-next').addEventListener('click', function () {
            if (frame === 3) {
              ig.result = { action: 'story_view', frames: ig.frames.slice() };
              try { sessionStorage.setItem('ig_story_frames', JSON.stringify(ig.frames)); } catch (e) {}
              location.href = user === 'next.user' ? '/stories/riley.sample/' : '/' + user + '/';
              return;
            }
            frame += 1;
            ig.frames.push(frame);
          });
        } else if ((m = path.match(/^\/p\/([^/]+)\/$/))) {
          ig.page = 'post:' + m[1];
          main.innerHTML =
            '<article><section><span role="button" id="like">' + icon('Like') + '</span>' +
            '<span role="button">' + icon('Comment') + '</span></section>' +
            // A comment's own like heart sits in a list, not in the action bar.
            '<ul><li>nice! <span role="button">' + icon('Like') + '</span></li></ul>' +
            '<form><textarea aria-label="Add a comment…"></textarea><div role="button" id="post"><svg width="12" height="12"><title>Send icon</title></svg>Post</div></form></article>' +
            // Another form with its own "Post" (audit 7c9d68a): never the comment's.
            '<form id="other-form"><input aria-label="Search"><div role="button" id="other-post">Post</div></form>';
          ig.otherPosts = 0;
          document.getElementById('other-post').addEventListener('click', function () { ig.otherPosts += 1; });
          var like = document.getElementById('like');
          like.addEventListener('click', function () {
            ig.events.push('click:like');
            if (m[1] === 'blocked') {
              document.body.insertAdjacentHTML('beforeend',
                '<div role="dialog"><h3>Try Again Later</h3><p>We restrict certain activity to protect our community.</p></div>');
              return;
            }
            like.innerHTML = icon('Unlike');
            ig.result = { action: 'like' };
          });
          var area = main.querySelector('textarea');
          area.addEventListener('keydown', function () { ig.events.push('keydown:comment'); });
          document.getElementById('post').addEventListener('click', function () { ig.result = { action: 'comment', text: area.value }; });
        } else if ((m = path.match(/^\/([A-Za-z0-9._]+)\/$/))) {
          // The DM composer: a dialog whose header links the person it is with.
          var dmThread = function (user) {
            var who = user === 'wrongthread.user' || user === 'decoyswrong.user' ? 'mallory' : user;
            // decoys.user links its header absolutely (same origin); otherorigin.user links the
            // approved path on another origin.
            var href = user === 'decoys.user' ? location.origin + '/' + who + '/' :
              user === 'otherorigin.user' ? 'https://elsewhere.invalid/' + who + '/' : '/' + who + '/';
            var decoy = user === 'decoyswrong.user' ? user : 'mallory';
            var decoys = user === 'decoys.user' || user === 'decoyswrong.user';
            var thread = function (editable, id) {
              return '<div role="dialog"' + id + ' hidden><header><a href="' + href + '">' + who + '</a></header>' +
                (decoys ? '<header style="display:none"><a href="/' + decoy + '/">' + decoy + '</a></header>' +
                  '<div class="messages"><p>Have you met <a href="/' + decoy + '/">' + decoy + '</a>?</p></div>' : '') +
                '<div aria-label="Message" contenteditable="' + editable + '"></div>' +
                (id ? '<div role="button" id="send"><svg width="12" height="12"><title>Paper plane icon</title></svg>Send</div>' : '') + '</div>';
            };
            return thread('true', ' id="dm"') +
              (user === 'twothreads.user' ? thread('false', '').replace(' hidden', '') : '') +
              (decoys ? '<aside class="inbox"><a href="/' + decoy + '/">' + decoy + '</a></aside>' : '');
          };
          ig.page = 'profile:' + m[1];
          try { ig.storyFrames = JSON.parse(sessionStorage.getItem('ig_story_frames') || 'null'); } catch (e) {}
          try { ig.storyDecoyNext = Number(sessionStorage.getItem('ig_decoy_next') || '0'); } catch (e) {}
          ig.highlightNext = 0;
          main.innerHTML =
            // wrongowner.user (RoseCat 8b05366): someone else's profile at the unchanged path.
            '<header><h2>' + (m[1] === 'wrongowner.user' ? 'mallory' : m[1]) + '</h2><span id="header-actions"></span></header>' +
            // Highlights: avatars in a section and a carousel "Next".
            '<section class="highlights"><img alt="highlight" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="56" height="56">' +
            '<button aria-label="Next" id="highlight-next">Next</button></section>' +
            // Suggested accounts have Follow buttons outside the header.
            '<aside><button>Follow</button></aside>' +
            // The profile grid: images in a section, like a story frame's.
            '<section class="grid"><img alt="post" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="100" height="100"></section>' +
            dmThread(m[1]) +
            // A share sheet with its own Send, outside the DM composer: never
            // the DM's (audit 7c9d68a).
            '<div id="share-sheet"><span>Share this profile</span><div role="button" id="share-send">Send</div></div>';
          document.getElementById('highlight-next').addEventListener('click', function () { ig.highlightNext += 1; });
          // S8 decision 13 (recipient modes, by username): the thread's header names the approved
          // person unless the mode says otherwise; decoys name someone else (or, in
          // decoyswrong.user, the approved person while the header does not).
          if (m[1] === 'pushstate.user') {
            document.addEventListener('pointerdown', function (e) {
              if (e.target.closest && e.target.closest('#message')) history.pushState({}, '', '/mallory/');
            }, true);
          }
          if (m[1] === 'keydownswap.user') {
            var swapped = false;
            document.addEventListener('keydown', function (e) {
              if (swapped || !e.target.closest || !e.target.closest('#dm')) return;
              swapped = true;
              document.querySelector('#dm header a').setAttribute('href', '/mallory/');
            }, true);
          }
          var dm = document.getElementById('dm');
          var box = dm.querySelector('[contenteditable]');
          document.getElementById('send').addEventListener('click', function () { ig.result = { action: 'dm', text: box.textContent }; });
          ig.shareSends = 0;
          document.getElementById('share-send').addEventListener('click', function () { ig.shareSends += 1; });
          // nosend.user: the composer has no Send (renamed while sending), so
          // the share sheet's Send is the page's only one (RoseCat 5194).
          if (m[1] === 'nosend.user') document.getElementById('send').textContent = 'Sending\u2026';
          setTimeout(function () {
            // Icons with a <title> (text too) in Follow and Message (audit 7c9d68a).
            document.getElementById('header-actions').innerHTML = '<button id="follow"><svg width="12" height="12"><title>Add person icon</title></svg>Follow</button>' +
              '<div role="button" id="message"><svg width="12" height="12"><title>Paper plane icon</title></svg>Message</div>';
            var follow = document.getElementById('follow');
            follow.addEventListener('click', function () {
              var state = m[1] === 'private.user' ? 'Requested' : 'Following';
              // The live markup after the click: visible text plus a chevron
              // svg whose <title> is text too.
              follow.innerHTML = '<div class="_ap3a"><div dir="auto"> ' + state + ' </div>' +
                '<svg aria-label="" height="12" width="12" role="img"><title>Down chevron icon</title><path d="M0 0h12v12z"></path></svg></div>';
              var similar = document.createElement('div');
              similar.setAttribute('role', 'button');
              similar.textContent = 'Similar accounts';
              document.getElementById('header-actions').appendChild(similar);
              var suggested = '';
              for (var i = 0; i < 9; i += 1) suggested += '<div><span>suggested.' + i + '</span><button>Follow</button></div>';
              document.querySelector('header').insertAdjacentHTML('afterend', '<section class="suggested">' + suggested + '</section>');
              ig.result = { action: 'follow', state: state };
            });
            // S8 decision 13 (a thread that opens as a new page): crossdoc.user's Message loads
            // its thread at /direct/t/77/; crossdocwrong.user's loads another profile instead.
            document.getElementById('message').addEventListener('click', function () {
              if (m[1] === 'crossdoc.user') location.assign('/direct/t/77/?with=crossdoc.user');
              else if (m[1] === 'crossdocwrong.user') location.assign('/mallory/');
              else dm.hidden = false;
            });
          }, 1500);
        } else if ((m = path.match(/^\/direct\/t\/([^/]+)\/$/))) {
          // A DM thread as its own page: the dialog whose header links the person it is with.
          ig.page = 'thread:' + m[1];
          var withUser = params.get('with') || 'nobody';
          main.innerHTML = '<div role="dialog" id="dm"><header><a href="/' + withUser + '/">' + withUser + '</a></header>' +
            '<div aria-label="Message" contenteditable="true"></div>' +
            '<div role="button" id="send"><svg width="12" height="12"><title>Paper plane icon</title></svg>Send</div></div>';
          var threadBox = main.querySelector('[contenteditable]');
          document.getElementById('send').addEventListener('click', function () { ig.result = { action: 'dm', text: threadBox.textContent }; });
        } else {
          ig.page = 'other';
        }
      })();
    </script>
  </body>
</html>
