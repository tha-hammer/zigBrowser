[project]
name = "zb-agent-host"
version = "0.1.0"
description = "zigBrowser's Claude Agent helper (spawned and supervised by the browser)"
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk==0.2.165"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zb_agent_host*"]
